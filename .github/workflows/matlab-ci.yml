name: MATLAB CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: matlab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MATLAB R2026a tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB and required products
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          products: Signal_Processing_Toolbox Optimization_Toolbox
          cache: true

      - name: Verify products and analyze code
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            assert(exist('phasez', 'file') == 2,
            'Signal Processing Toolbox function phasez is unavailable');
            assert(exist('lsqnonlin', 'file') == 2,
            'Optimization Toolbox function lsqnonlin is unavailable');
            run_code_analysis;

      - name: Run test suite and generate reports
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: src
          select-by-folder: tests
          test-results-junit: test-results/results.xml
          code-coverage-cobertura: coverage/coverage.xml

      - name: Publish test and coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: matlab-test-and-coverage
          path: |
            test-results/results.xml
            coverage/coverage.xml
          if-no-files-found: error
          retention-days: 14
