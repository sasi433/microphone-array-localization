name: MATLAB CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: matlab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MATLAB R2026a tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB and required products
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          products: Signal_Processing_Toolbox Optimization_Toolbox
          cache: true

      - name: Verify products, analyze code, and run test suite
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            assert(exist('phasez', 'file') == 2,
            'Signal Processing Toolbox function phasez is unavailable');
            assert(exist('lsqnonlin', 'file') == 2,
            'Optimization Toolbox function lsqnonlin is unavailable');
            run_code_analysis;
            run_tests;
